# WezTerm (used_tmux.lua) から Shift+Space を KKP (CSI u) シーケンスで prefix として受信する
# WezTerm 側: keybinds/used_tmux.lua で \x1b[32;2u を送信
set -s extended-keys on

set -g prefix S-Space
unbind C-b
bind S-Space send-prefix

set -g mode-keys vi
set -g set-clipboard on
set -g mouse on

# ---------------------------------------------------------------
# タブ (= tmux window) 操作
# ---------------------------------------------------------------
bind t new-window
bind w kill-window

# タブ切り替え (prefix不要、常時有効)
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-Left previous-window
bind -n M-Right next-window

# ---------------------------------------------------------------
# ペイン操作
# ---------------------------------------------------------------
# 分割 (左分割は33%幅)
bind h split-window -hb -l 33%
bind j split-window -v  -l 33%
bind k split-window -vb
bind l split-window -h

bind x kill-pane

# ペイン移動 (prefix不要、常時有効)
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R

# ---------------------------------------------------------------
# リサイズモード (Prefix+R → hjkl, Escapeで終了)
# ---------------------------------------------------------------
bind r switch-client -T resize_pane
bind -T resize_pane h resize-pane -L 3 \; switch-client -T resize_pane
bind -T resize_pane j resize-pane -D 3 \; switch-client -T resize_pane
bind -T resize_pane k resize-pane -U 3 \; switch-client -T resize_pane
bind -T resize_pane l resize-pane -R 3 \; switch-client -T resize_pane
bind -T resize_pane Escape switch-client -T root

# ---------------------------------------------------------------
# コピーモード (Prefix+V, vi風)
# ---------------------------------------------------------------
bind v copy-mode

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi a   send -X cancel
bind -T copy-mode-vi q   send -X cancel
bind -T copy-mode-vi H   send -N 10 -X cursor-left
bind -T copy-mode-vi J   send -N 10 -X cursor-down
bind -T copy-mode-vi K   send -N 10 -X cursor-up
bind -T copy-mode-vi L   send -N 10 -X cursor-right

# ---------------------------------------------------------------
# 専用ツール起動 (popup表示)
# ---------------------------------------------------------------
bind b display-popup -E "btop"
bind p display-popup -E "localhost-top"

# 設定リロード
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------
# UI設定 (WezTermのタブバー配色に合わせる: アクティブ=緑 #9ddb23, 非アクティブ=グレー #bfbdb5, 背景=黒)
# ---------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#bfbdb5"

# WezTermのタブバー (hide_tab_bar_if_only_one_tab) に合わせ、windowが1つだけの間は自動非表示
set-hook -g session-created         'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'
set-hook -g window-linked           'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'
set-hook -g window-unlinked         'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'
set-hook -g client-session-changed  'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'

# 左: 1つめのwindow (":^" = セッション内で最小indexのwindow) が開いているディレクトリ名
set -g status-left-length 30
set -g status-left "#[fg=#9ddb23,bold] #(tmux display-message -p -t '#{session_name}:^' '#{pane_current_path}' 2>/dev/null | xargs -I{} basename {}) #[fg=#bfbdb5,nobold]"

# 中央〜: window一覧 (WezTermのタブ形状 … で両端を挟む。アクティブ=緑背景, 非アクティブ=グレー背景)
set -g window-status-separator ""
set -g window-status-format "#[fg=#bfbdb5,bg=default]#[fg=#000000,bg=#bfbdb5]    tab    #[fg=#bfbdb5,bg=default]"
set -g window-status-current-format "#[fg=#9ddb23,bg=default]#[fg=#000000,bg=#9ddb23,bold]    tab    #[fg=#9ddb23,bg=default,nobold]"

# 右: Prefix押下中インジケータ (待機中のみ点灯)
set -g status-right-length 20
set -g status-right "#{?client_prefix,#[fg=#9ddb23#,bold] PREFIX #[fg=#bfbdb5#,nobold],}"

# ペイン境界線 (アクティブ=緑で強調, 非アクティブ=グレー)
set -g pane-border-style "fg=#bfbdb5"
set -g pane-active-border-style "fg=#9ddb23"
