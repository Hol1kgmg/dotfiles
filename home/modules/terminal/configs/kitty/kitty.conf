# kitty 設定 (herdr 前提。WezTerm の keybinds/used_herdr.lua と対応)
# native モード相当 (コピーモード・workspace 等) は kitty に同等機能がないため持たない

# フォント
font_family PlemolJP Console NF
font_size   13.0
# macOS デフォルト (platform = ガンマ 1.7 + コントラスト 30%) は文字が太るため、WezTerm 寄りの細さに調整
# 第 2 引数 (0-100) で太さを微調整する (0 = 太らせ処理なし)
text_composition_strategy 1.0 0

# 色 (kitty デフォルトの前景 #dddddd / color7 #e5e5e5 は明るすぎるため WezTerm デフォルトの silver に揃える)
foreground #c0c0c0
color7     #c0c0c0

# ウィンドウ・透過
hide_window_decorations titlebar-only
background_opacity 0.80
background_blur    20
confirm_os_window_close 0

# タブバー (herdr がタブ/ステータス表示を持つため隠す)
tab_bar_style hidden

# Option を修飾キーとして扱う
macos_option_as_alt yes

# キーバインド
# kitty のデフォルト (ctrl+tab = next_tab, ctrl+shift+l = next_layout 等) と衝突するため全消し
clear_all_shortcuts yes

# herdr への KKP (Kitty Keyboard Protocol) 転送
map shift+space     send_text all \x1b[32;2u
map cmd+s           send_text all \x1b[115;9u
map ctrl+tab        send_text all \x1b[9;5u
map ctrl+shift+tab  send_text all \x1b[9;6u

# 新規タブ ("tab" で固定命名)
map cmd+t launch --type=tab --tab-title tab

# Zen モード用フォントサイズトグル (Neovim から呼び出し用。toggle_font_size.py で往復)
map ctrl+semicolon kitten toggle_font_size.py

# Cmd 系基本操作 (WezTerm の macOS デフォルトに合わせる。clear_all_shortcuts で消えるため定義)
map cmd+c            copy_to_clipboard
map cmd+v            paste_from_clipboard
map cmd+q            quit
map cmd+w            close_tab
map cmd+n            new_os_window
map cmd+h            hide_macos_app
map cmd+m            minimize_macos_window
map cmd+1            goto_tab 1
map cmd+2            goto_tab 2
map cmd+3            goto_tab 3
map cmd+4            goto_tab 4
map cmd+5            goto_tab 5
map cmd+6            goto_tab 6
map cmd+7            goto_tab 7
map cmd+8            goto_tab 8
map cmd+9            goto_tab 9
map cmd+shift+[      previous_tab
map cmd+shift+]      next_tab
map cmd+equal        change_font_size all +2.0
map cmd+minus        change_font_size all -2.0
map cmd+0            change_font_size all 0
map cmd+k            clear_terminal scrollback active
map cmd+r            load_config_file
